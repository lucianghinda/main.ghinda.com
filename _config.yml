title: Lucian Ghinda # The title of the blog
author: Lucian Ghinda # Your name
email: ideas@ghinda.com # your email shown in the footer
url: https://ghinda.com # this is your site's root address.
description: > # this means to ignore newlines until the next key
  Essays and notes on products, ideas, teams, and creativity — the personal
  writing home of Lucian Ghinda, a senior product engineer working in Ruby & Rails.
favicon: "./favicon.ico" # set the favicon of the site
avatar: "/assets/images/lucian-ghinda.webp" # portrait shown on the about page

show_excerpts: false # set to true to show excerpts on the homepage

permalink: /:categories/:year/:title:output_ext

# Social / hub links, rendered by _includes/social.html and the footer.
# A flat list of { name, url } pairs — order here is the order shown.
social_links:
  - name: GitHub
    url: "https://github.com/lucianghinda"
  - name: X
    url: "https://x.com/lucianghinda"
  - name: Mastodon
    url: "https://ruby.social/@lucian"
    me: true # emits rel="me" for identity verification
  - name: Bluesky
    url: "https://bsky.app/profile/lucianghinda.com"
  - name: LinkedIn
    url: "https://www.linkedin.com/in/lucianghinda"
  - name: RSS
    url: "/feed.xml"

# Newsletter invite, rendered by _includes/newsletter_invite.html at the end
# of every page (see _layouts/default.html; opt out per page with
# `newsletter: false` in front matter). It lives here rather than in the
# template so switching provider or endpoint is a config change.
#
# `action` is a plain GET to the beehiiv subscribe page: the address travels
# as ?email=..., beehiiv prefills its own form, and the reader confirms there.
# That keeps the site JavaScript-free beyond the theme toggle. beehiiv uses
# double opt-in, so a direct POST would not save the reader a step anyway.
#
# To subscribe in one step instead, take the embed URL from beehiiv
# (Dashboard -> Grow -> Subscribe Forms -> Embed) and set:
#   action: https://embeds.beehiiv.com/<uuid>
#   method: post
newsletter:
  name: Field Notes
  description: >-
    A personal newsletter with ideas on Ruby, software development, testing,
    building products and workshops, plus notes on creativity and tech trends.
  url: https://newsletter.lucianghinda.com
  action: https://newsletter.lucianghinda.com/subscribe
  method: get
  cadence: one email a week

# Build settings
twitter:
  card: summary
  username: lucianghinda

# Tailwind v4 via crbelaus/jekyll-tailwind: compiles _tailwind.css into the built
# site at _site/assets/css/styles.css. No Node — tailwindcss-ruby ships the CLI.
tailwind:
  input: "_tailwind.css"
  output: "_site/assets/css/styles.css"
  minify: true

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-target-blank
  - jekyll-redirect-from # redirects old ghinda.com URLs to their new homes
  - jekyll-agent-markdown # writes a raw .md sibling per post plus /llms.txt

target-blank:
  noreferrer: false

# lucianghinda/jekyll-agent-markdown: exports every post as raw Markdown next to
# its HTML (/2026/post.html -> /2026/post.md), so agents read the source instead
# of scraping rendered pages.
#
# llms_txt is off because ./llms.txt in this repo builds the index instead: it
# also lists posts from notes.ghinda.com and allaboutcoding.ghinda.com, which
# the gem cannot know about (it never touches the network). The gem still
# publishes the per-post .md files and exposes post.agent_markdown_url, which
# that template reads. Leaving this true would make the two fight over
# /llms.txt and log a collision warning on every build.
agent_markdown:
  posts: true
  llms_txt: false
  sort: desc
  include_dates: true

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - config
  - Capfile
  - Procfile
  - Rakefile
  - workspace.yml
  - bin
  - _tailwind.css
  - scripts
  - README.md
  - LICENSE.md
  - NOTICE
